[project]
name = "shepherd-nova"
version = "0.6.0"
description = "Public instance of the Shepherd Testbed"
requires-python = ">=3.12"
dependencies = [
    "sphinx>=9.1.0",
    "sphinxawesome-theme",
    "sphinx-sitemap",
    "myst-parser",
    "docutils",
    "shepherd-data",
    "shepherd-client",
    "prek",  # pre-commit replacement
]

[tool.codespell]
builtin = "clear,rare,informal,usage,code,en-GB_to_en-US"
skip = "*.svg,"
ignore-words-list = "fram,master,theses"
check-filenames = true
check-hidden = true

[tool.rumdl]
# Global options at root level
line-length = 320
respect-gitignore = true
exclude = [".git"]

[tool.rumdl.MD013] # line length
code_blocks = false
tables = false

[tool.rumdl.MD051]
ignore-case = true
anchor-style = "python-markdown"

[tool.rumdl.MD057]
absolute-links = "relative_to_roots"
roots = ["docs"]
